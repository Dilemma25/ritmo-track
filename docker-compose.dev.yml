services:
  ritmotrack-backend:
    container_name: ritmotrack-backend
    build:
      context: backend/
      target: dev
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "${PORT}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - ritmotrack-db

  ritmotrack-db:
    container_name: ritmotrack-db
    image: postgres:16.11
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ritmotrack-data:/var/lib/postgresql/data

volumes:
  ritmotrack-data: